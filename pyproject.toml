[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piezoscanner"
version = "1.3.1"
description = "FLEX PiezoScanner: PyQt6 controller and live raster-scan viewer for piezo scan stages, with a switchable Multichannel Lockin / nidaqstudio backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Pubudu Wijesinghe", email = "pubudu.wijesinghe@levylab.org" }]
dependencies = [
    "PyQt6>=6.6",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

# Both hardware backends are internal packages distributed outside PyPI --
# install whichever one(s) you need separately in the same environment.
# Without either, the application still launches in Simulation Mode.
#   - "lockin" backend:     flex (flex.inst.levylab.Lockin.Lockin)
#   - "nidaqstudio" backend: nidaqstudio (talks to it over ZMQ -- the
#      nidaqstudio *server* process, GUI or --api-only, runs separately
#      and doesn't need to be on this machine or in this environment)

[project.scripts]
piezoscanner = "piezoscanner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
